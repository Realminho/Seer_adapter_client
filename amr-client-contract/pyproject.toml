[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-client-contract"
version = "0.1.0"
# The common contract (interfaces) between the adaptor and any AMR client.
# 어댑터와 모든 AMR 클라이언트 사이의 공용 계약(인터페이스).
#
# This package contains ONLY interfaces (typing.Protocol) and marker
# interfaces (ABC). It has zero runtime dependencies and imports no client
# and no adaptor code, so the dependency direction is always:
#     adaptor  -> amr-client-contract <-  seer-client / jibot-client
# 이 패키지는 인터페이스(typing.Protocol)와 marker interface(ABC)만 담는다.
# 런타임 의존성 0, 어떤 클라이언트/어댑터도 import 하지 않으므로 의존 방향은 항상
# 위와 같이 contract 를 향한다(순환 의존 없음).
description = "Adaptor <-> AMR-client common contract: Protocols + marker interfaces"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
