# The default 100M cap plus one-per-second CTRL-EVENT-SCAN-FAILED spam evicts
# every kernel message within minutes, so by the time a WiFi outage is
# reported, the dmesg that would explain it is already gone -- only two boots
# survived on .61. The rootfs has ~12G free, so give the journal room to keep
# enough history to diagnose across a failure.

[Journal]
SystemMaxUse=500M
SystemMaxFileSize=50M
