# These robots lose power without warning -- .61 died three times on
# 2026-08-20 with no shutdown sequence at all -- and the only record of what
# the robot was doing is the journal. journald's default SyncIntervalSec is
# 5 minutes, so on an abrupt cut the last minutes can be gone exactly when
# they matter. We got lucky on 2026-08-20 (logs survived to the final second);
# this makes that guaranteed rather than luck.
#
# The cost is a disk sync per second on an idle-ish log stream, which this
# board handles fine and which the ext4 commit interval was doing anyway.

[Journal]
SyncIntervalSec=1s
