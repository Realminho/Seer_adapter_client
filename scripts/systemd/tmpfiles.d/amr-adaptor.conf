# /run/amr-adaptor: adapter <-> WebUi local IPC root (tmpfs).
# Installed by scripts/setup-adaptor-service.sh, which substitutes __USER__ for
# this host's deploy user. Each adapter creates and owns its own <serial>/
# subdirectory under here at runtime (state.json, health.json, control.sock);
# systemd RuntimeDirectory is intentionally NOT used so multiple
# amr-adaptor@<id> instances don't clobber the shared root.
d /run/amr-adaptor 0750 __USER__ __USER__ -
