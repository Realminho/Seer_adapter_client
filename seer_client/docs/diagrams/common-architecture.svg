<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">SEER Client 공통 내부 구조</title>
  <desc id="desc">진입점에서 SeerClient와 상태, 이동, 제어, IO 서비스, 프로토콜을 거쳐 시뮬레이터 또는 실제 장비로 연결되는 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>.box{fill:#eaf2ff;stroke:#2563eb;stroke-width:2}.service{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.target{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.3;marker-end:url(#arrow)}.txt{font:500 17px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033;text-anchor:middle;dominant-baseline:middle}.sub{font:400 14px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569;text-anchor:middle}@media(prefers-color-scheme:dark){.box{fill:#172554;stroke:#60a5fa}.service{fill:#2e1065;stroke:#a78bfa}.target{fill:#052e16;stroke:#4ade80}.txt{fill:#f8fafc}.sub{fill:#cbd5e1}.line{stroke:#94a3b8}}</style>
  </defs>
  <rect class="box" x="375" y="20" width="450" height="58" rx="10"/><text class="txt" x="600" y="49">run_adapter.py 또는 manual_test.py</text>
  <path class="line" d="M600 78 V112"/>
  <rect class="box" x="450" y="115" width="300" height="58" rx="10"/><text class="txt" x="600" y="144">SeerClient</text>
  <path class="line" d="M600 173 V205"/>
  <path class="line" d="M150 205 H1050"/>
  <path class="line" d="M150 205 V235"/><path class="line" d="M450 205 V235"/><path class="line" d="M750 205 V235"/><path class="line" d="M1050 205 V235"/>
  <rect class="service" x="30" y="238" width="240" height="58" rx="10"/><text class="txt" x="150" y="267">status.py</text>
  <rect class="service" x="330" y="238" width="240" height="58" rx="10"/><text class="txt" x="450" y="267">navigation.py</text>
  <rect class="service" x="630" y="238" width="240" height="58" rx="10"/><text class="txt" x="750" y="267">control.py</text>
  <rect class="service" x="930" y="238" width="240" height="58" rx="10"/><text class="txt" x="1050" y="267">io.py</text>
  <path class="line" d="M150 296 C150 330 470 315 470 345"/><path class="line" d="M450 296 C450 320 530 320 530 345"/><path class="line" d="M750 296 C750 320 670 320 670 345"/><path class="line" d="M1050 296 C1050 330 730 315 730 345"/>
  <rect class="box" x="430" y="348" width="340" height="58" rx="10"/><text class="txt" x="600" y="377">commands.py · API/포트 선택</text>
  <path class="line" d="M600 406 V438"/>
  <rect class="box" x="430" y="441" width="340" height="58" rx="10"/><text class="txt" x="600" y="470">connection.py · TCP 요청/응답</text>
  <path class="line" d="M600 499 V531"/>
  <rect class="box" x="430" y="534" width="340" height="62" rx="10"/><text class="txt" x="600" y="555"><tspan x="600">protocol.py</tspan><tspan class="sub" x="600" dy="21">16바이트 헤더 + JSON</tspan></text>
  <path class="line" d="M500 596 C500 610 280 600 280 615"/><path class="line" d="M700 596 C700 610 920 600 920 615"/>
  <rect class="target" x="90" y="600" width="380" height="18" rx="9"/><text class="sub" x="280" y="614">로컬 시뮬레이터</text>
  <rect class="target" x="730" y="600" width="380" height="18" rx="9"/><text class="sub" x="920" y="614">실제 SEER AMR</text>
</svg>
