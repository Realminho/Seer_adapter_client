<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300" role="img" aria-labelledby="title desc">
  <title id="title">원본 Adapter와 실제 SEER 연결</title>
  <desc id="desc">FMS와 원본 Adapter가 브리지와 기능별 SeerClient, 프로토콜을 거쳐 실제 SEER AMR로 연결되는 구조</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.box{fill:#eaf2ff;stroke:#2563eb;stroke-width:2}.real{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.fms{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.3;marker-end:url(#arrow)}.txt{font:500 15px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033;text-anchor:middle;dominant-baseline:middle}.sub{font:400 13px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569;text-anchor:middle}@media(prefers-color-scheme:dark){.box{fill:#172554;stroke:#60a5fa}.real{fill:#052e16;stroke:#4ade80}.fms{fill:#431407;stroke:#fb923c}.txt{fill:#f8fafc}.sub{fill:#cbd5e1}.line{stroke:#94a3b8}}</style></defs>
  <rect class="fms" x="20" y="85" width="150" height="70" rx="10"/><text class="txt" x="95" y="110"><tspan x="95">FMS</tspan><tspan class="sub" x="95" dy="22">MQTT</tspan></text>
  <line class="line" x1="170" y1="120" x2="205" y2="120"/>
  <rect class="box" x="210" y="85" width="185" height="70" rx="10"/><text class="txt" x="302" y="110"><tspan x="302">원본</tspan><tspan class="sub" x="302" dy="22">adaptor/main.py</tspan></text>
  <line class="line" x1="395" y1="120" x2="430" y2="120"/>
  <rect class="box" x="435" y="85" width="140" height="70" rx="10"/><text class="txt" x="505" y="120">bridge.py</text>
  <line class="line" x1="575" y1="120" x2="610" y2="120"/>
  <rect class="box" x="615" y="70" width="235" height="100" rx="10"/><text class="txt" x="732" y="96"><tspan x="732">SeerAdapterClient</tspan><tspan class="sub" x="732" dy="23">status · navigation</tspan><tspan class="sub" x="732" dy="20">control · io</tspan></text>
  <line class="line" x1="850" y1="120" x2="885" y2="120"/>
  <rect class="box" x="890" y="85" width="220" height="70" rx="10"/><text class="txt" x="1000" y="110"><tspan x="1000">SEER TCP</tspan><tspan class="sub" x="1000" dy="22">16바이트 헤더 + JSON</tspan></text>
  <line class="line" x1="1110" y1="120" x2="1145" y2="120"/>
  <rect class="real" x="1150" y="85" width="220" height="70" rx="10"/><text class="txt" x="1260" y="110"><tspan x="1260">실제</tspan><tspan class="sub" x="1260" dy="22">SEER AMR</tspan></text>
  <path class="line" d="M1260 155 C1260 260 302 260 302 165"/>
  <text class="sub" x="780" y="278">실제 위치·배터리·작업 상태가 원본 Adapter를 통해 FMS로 보고됨</text>
</svg>
