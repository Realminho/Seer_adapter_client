<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">실제 SEER 장비 연결 순서</title>
  <desc id="desc">장비 IP 입력부터 다섯 포트 연결, 상태와 지도 폴링, 제어 명령과 실제 처리 결과까지의 순서</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.box{fill:#eaf2ff;stroke:#2563eb;stroke-width:2}.real{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.state{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)}.txt{font:500 17px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033;text-anchor:middle;dominant-baseline:middle}.sub{font:400 14px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569;text-anchor:middle}@media(prefers-color-scheme:dark){.box{fill:#172554;stroke:#60a5fa}.real{fill:#052e16;stroke:#4ade80}.state{fill:#431407;stroke:#fb923c}.txt{fill:#f8fafc}.sub{fill:#cbd5e1}.line{stroke:#94a3b8}}</style></defs>
  <rect class="state" x="350" y="20" width="500" height="58" rx="10"/><text class="txt" x="600" y="49">1. 실제 SEER 장비 IP 입력</text>
  <path class="line" d="M600 78 V108"/>
  <rect class="box" x="350" y="111" width="500" height="58" rx="10"/><text class="txt" x="600" y="140">2. SeerAdapterClient 생성</text>
  <path class="line" d="M600 169 V199"/>
  <rect class="box" x="160" y="202" width="880" height="70" rx="10"/><text class="txt" x="600" y="226"><tspan x="600">3. TCP 5포트 연결</tspan><tspan class="sub" x="600" dy="24">STATE 19204 · CONTROL 19205 · TASK 19206 · CONFIG 19207 · OTHER 19210</tspan></text>
  <path class="line" d="M600 272 V302"/>
  <rect class="real" x="350" y="305" width="500" height="58" rx="10"/><text class="txt" x="600" y="334">4. 실제 SEER AMR와 TCP 연결 완료</text>
  <path class="line" d="M500 363 C500 395 320 390 320 420"/><path class="line" d="M700 363 C700 395 880 390 880 420"/>
  <rect class="state" x="90" y="423" width="460" height="72" rx="10"/><text class="txt" x="320" y="447"><tspan x="320">5A. 상태·지도 폴링</tspan><tspan class="sub" x="320" dy="24">좌표·배터리·차단·emergency·API 4011 지도</tspan></text>
  <rect class="box" x="650" y="423" width="460" height="72" rx="10"/><text class="txt" x="880" y="447"><tspan x="880">5B. 사용자 또는 FMS 명령</tspan><tspan class="sub" x="880" dy="24">이동·정지·IO·맵 제어</tspan></text>
  <path class="line" d="M320 495 C320 530 510 520 510 550"/><path class="line" d="M880 495 C880 530 690 520 690 550"/>
  <rect class="real" x="350" y="553" width="500" height="72" rx="10"/><text class="txt" x="600" y="577"><tspan x="600">6. 실제 장비 응답 처리</tspan><tspan class="sub" x="600" dy="24">상태 캐시 갱신 또는 명령 결과 반환</tspan></text>
</svg>
