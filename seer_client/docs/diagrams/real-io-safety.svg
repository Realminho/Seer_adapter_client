<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">실제 장비 IO 쓰기 안전 흐름</title>
  <desc id="desc">DO 명령이 allow-write 옵션 유무에 따라 차단되거나 실제 장비와 외부 장치로 전달되는 흐름</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.box{fill:#eaf2ff;stroke:#2563eb;stroke-width:2}.safe{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.blocked{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)}.txt{font:500 17px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033;text-anchor:middle;dominant-baseline:middle}.sub{font:400 14px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569;text-anchor:middle}.yes{font:500 15px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#166534;text-anchor:middle}.no{font:500 15px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#b91c1c;text-anchor:middle}@media(prefers-color-scheme:dark){.box{fill:#172554;stroke:#60a5fa}.safe{fill:#052e16;stroke:#4ade80}.warn{fill:#431407;stroke:#fb923c}.blocked{fill:#450a0a;stroke:#f87171}.txt{fill:#f8fafc}.sub{fill:#cbd5e1}.yes{fill:#86efac}.no{fill:#fca5a5}.line{stroke:#94a3b8}}</style></defs>
  <rect class="warn" x="450" y="20" width="300" height="60" rx="10"/><text class="txt" x="600" y="50">do 3 on 입력</text>
  <path class="line" d="M600 80 V120"/>
  <rect class="box" x="400" y="123" width="400" height="66" rx="10"/><text class="txt" x="600" y="147"><tspan x="600">manual_test.py</tspan><tspan class="sub" x="600" dy="23">실제 장비 쓰기 권한 검사</tspan></text>
  <path class="line" d="M500 189 C500 220 270 215 270 250"/><text class="no" x="370" y="221">--allow-write 없음</text>
  <path class="line" d="M700 189 C700 220 930 215 930 250"/><text class="yes" x="830" y="221">--allow-write 있음</text>
  <rect class="blocked" x="80" y="253" width="380" height="70" rx="10"/><text class="txt" x="270" y="277"><tspan x="270">명령 차단</tspan><tspan class="sub" x="270" dy="23">실제 출력은 변경되지 않음</tspan></text>
  <rect class="safe" x="740" y="253" width="380" height="70" rx="10"/><text class="txt" x="930" y="277"><tspan x="930">SeerClient.set_do(3, true)</tspan><tspan class="sub" x="930" dy="23">OTHER 19210 · API 6001</tspan></text>
  <path class="line" d="M930 323 V363"/>
  <rect class="safe" x="740" y="366" width="380" height="58" rx="10"/><text class="txt" x="930" y="395">실제 SEER AMR · DO 3 ON</text>
  <path class="line" d="M930 424 V464"/>
  <rect class="warn" x="740" y="467" width="380" height="38" rx="10"/><text class="sub" x="930" y="491">연결된 램프·릴레이·PLC 등 실제 동작</text>
</svg>
