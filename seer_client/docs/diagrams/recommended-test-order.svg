<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
  <title id="title">권장 SEER 테스트 순서</title>
  <desc id="desc">시뮬레이터 수동 테스트부터 Adapter 시뮬레이션, 실제 장비 조회, 안전 확인, 실제 IO와 Adapter 운용까지의 순서</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.sim{fill:#eaf2ff;stroke:#2563eb;stroke-width:2}.safe{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.real{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)}.txt{font:500 17px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033;text-anchor:middle;dominant-baseline:middle}.tag{font:500 14px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569;text-anchor:middle}@media(prefers-color-scheme:dark){.sim{fill:#172554;stroke:#60a5fa}.safe{fill:#431407;stroke:#fb923c}.real{fill:#052e16;stroke:#4ade80}.txt{fill:#f8fafc}.tag{fill:#cbd5e1}.line{stroke:#94a3b8}}</style></defs>
  <text class="tag" x="190" y="35">장비 없는 단계</text><text class="tag" x="1010" y="35">실제 장비 단계</text>
  <rect class="sim" x="70" y="55" width="360" height="58" rx="10"/><text class="txt" x="250" y="84">1. manual_test.py --simulator</text>
  <path class="line" d="M250 113 V145"/>
  <rect class="sim" x="70" y="148" width="360" height="58" rx="10"/><text class="txt" x="250" y="177">2. status / io / do / 이동 확인</text>
  <path class="line" d="M250 206 V238"/>
  <rect class="sim" x="70" y="241" width="360" height="58" rx="10"/><text class="txt" x="250" y="270">3. run_adapter.py --simulator</text>
  <path class="line" d="M250 299 V331"/>
  <rect class="sim" x="70" y="334" width="360" height="58" rx="10"/><text class="txt" x="250" y="363">4. 원본 Adapter / FMS 흐름 확인</text>
  <path class="line" d="M430 363 C580 363 620 84 770 84"/>
  <rect class="real" x="770" y="55" width="360" height="58" rx="10"/><text class="txt" x="950" y="84">5. manual_test.py --ip 장비IP</text>
  <path class="line" d="M950 113 V145"/>
  <rect class="real" x="770" y="148" width="360" height="58" rx="10"/><text class="txt" x="950" y="177">6. 실제 상태 조회만 확인</text>
  <path class="line" d="M950 206 V238"/>
  <rect class="safe" x="740" y="241" width="420" height="70" rx="10"/><text class="txt" x="950" y="265"><tspan x="950">7. 주변·배선·비상정지 확인</tspan><tspan class="tag" x="950" dy="23">쓰기 전에 반드시 안전 점검</tspan></text>
  <path class="line" d="M950 311 V343"/>
  <rect class="real" x="740" y="346" width="420" height="58" rx="10"/><text class="txt" x="950" y="375">8. --allow-write로 실제 IO / 이동 시험</text>
  <path class="line" d="M950 404 V436"/>
  <rect class="real" x="740" y="439" width="420" height="58" rx="10"/><text class="txt" x="950" y="468">9. run_adapter.py --vehicle-ip 장비IP</text>
  <path class="line" d="M950 497 V545"/>
  <rect class="safe" x="330" y="548" width="540" height="82" rx="10"/><text class="txt" x="600" y="575"><tspan x="600">최종 운용 전 확인</tspan><tspan class="tag" x="600" dy="24">상태·IO·이동·FMS 보고가 모두 정상인지 검증</tspan></text>
</svg>
