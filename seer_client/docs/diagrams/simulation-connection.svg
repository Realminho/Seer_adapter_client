<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc">
  <title id="title">시뮬레이션 연결 순서</title>
  <desc id="desc">초기 상태 입력부터 로컬 서버 시작, 네 포트 TCP 연결, 상태 요청과 화면 출력까지의 순서</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.box{fill:#eaf2ff;stroke:#2563eb;stroke-width:2}.sim{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.state{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)}.txt{font:500 17px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033;text-anchor:middle;dominant-baseline:middle}.num{font:500 15px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569;text-anchor:middle}@media(prefers-color-scheme:dark){.box{fill:#172554;stroke:#60a5fa}.sim{fill:#052e16;stroke:#4ade80}.state{fill:#431407;stroke:#fb923c}.txt{fill:#f8fafc}.num{fill:#cbd5e1}.line{stroke:#94a3b8}}</style></defs>
  <rect class="state" x="300" y="20" width="500" height="58" rx="10"/><text class="txt" x="550" y="49">1. --simulator + x / y / theta / battery 입력</text>
  <path class="line" d="M550 78 V108"/>
  <rect class="box" x="300" y="111" width="500" height="58" rx="10"/><text class="txt" x="550" y="140">2. SeerSimulatedAdapterClient 생성</text>
  <path class="line" d="M550 169 V199"/>
  <rect class="sim" x="300" y="202" width="500" height="58" rx="10"/><text class="txt" x="550" y="231">3. 로컬 SeerSimulatorServer 시작</text>
  <path class="line" d="M550 260 V290"/>
  <rect class="sim" x="250" y="293" width="600" height="58" rx="10"/><text class="txt" x="550" y="322">4. STATE / CONTROL / TASK / OTHER 임시 포트 반환</text>
  <path class="line" d="M550 351 V381"/>
  <rect class="box" x="300" y="384" width="500" height="58" rx="10"/><text class="txt" x="550" y="413">5. 공통 SeerClient가 TCP 5포트 연결</text>
  <path class="line" d="M550 442 V472"/>
  <rect class="state" x="300" y="475" width="500" height="58" rx="10"/><text class="txt" x="550" y="504">6. status 또는 Adapter 상태 요청</text>
  <path class="line" d="M550 533 V563"/>
  <rect class="sim" x="250" y="566" width="600" height="58" rx="10"/><text class="txt" x="550" y="595">7. 가상 좌표·배터리·작업·IO를 SEER 형식으로 응답</text>
  <path class="line" d="M550 624 V654"/>
  <rect class="box" x="300" y="657" width="500" height="28" rx="10"/><text class="num" x="550" y="677">8. 상태 캐시 갱신 → 터미널 또는 FMS 출력</text>
</svg>
