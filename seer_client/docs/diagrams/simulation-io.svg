<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">시뮬레이션 IO 변경 흐름</title>
  <desc id="desc">DO 3을 켜고 시뮬레이터가 상태를 저장한 뒤 IO 조회로 변경 결과를 확인하는 과정</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.box{fill:#eaf2ff;stroke:#2563eb;stroke-width:2}.sim{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.cmd{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)}.txt{font:500 17px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033;text-anchor:middle;dominant-baseline:middle}.sub{font:400 14px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569;text-anchor:middle}@media(prefers-color-scheme:dark){.box{fill:#172554;stroke:#60a5fa}.sim{fill:#052e16;stroke:#4ade80}.cmd{fill:#431407;stroke:#fb923c}.txt{fill:#f8fafc}.sub{fill:#cbd5e1}.line{stroke:#94a3b8}}</style></defs>
  <rect class="cmd" x="30" y="60" width="180" height="64" rx="10"/><text class="txt" x="120" y="92">do 3 on</text>
  <line class="line" x1="210" y1="92" x2="250" y2="92"/>
  <rect class="box" x="255" y="60" width="200" height="64" rx="10"/><text class="txt" x="355" y="84"><tspan x="355">manual_test.py</tspan><tspan class="sub" x="355" dy="22">set_do(3, true)</tspan></text>
  <line class="line" x1="455" y1="92" x2="495" y2="92"/>
  <rect class="box" x="500" y="60" width="180" height="64" rx="10"/><text class="txt" x="590" y="84"><tspan x="590">io.py</tspan><tspan class="sub" x="590" dy="22">API 6001</tspan></text>
  <line class="line" x1="680" y1="92" x2="720" y2="92"/>
  <rect class="box" x="725" y="60" width="190" height="64" rx="10"/><text class="txt" x="820" y="84"><tspan x="820">OTHER TCP</tspan><tspan class="sub" x="820" dy="22">DO 출력 포트</tspan></text>
  <line class="line" x1="915" y1="92" x2="955" y2="92"/>
  <rect class="sim" x="960" y="60" width="210" height="64" rx="10"/><text class="txt" x="1065" y="84"><tspan x="1065">시뮬레이터</tspan><tspan class="sub" x="1065" dy="22">DO 3 = true 저장</tspan></text>
  <path class="line" d="M1065 124 V208"/>
  <rect class="cmd" x="960" y="212" width="210" height="64" rx="10"/><text class="txt" x="1065" y="244">io 조회</text>
  <path class="line" d="M960 244 H900"/>
  <rect class="sim" x="630" y="212" width="265" height="64" rx="10"/><text class="txt" x="762" y="236"><tspan x="762">DI / DO 상태 응답</tspan><tspan class="sub" x="762" dy="22">DO 3 = true</tspan></text>
  <path class="line" d="M630 244 H570"/>
  <rect class="box" x="300" y="212" width="265" height="64" rx="10"/><text class="txt" x="432" y="236"><tspan x="432">터미널 표시</tspan><tspan class="sub" x="432" dy="22">변경 결과 확인</tspan></text>
  <path class="line" d="M432 276 V332"/>
  <rect class="cmd" x="300" y="336" width="265" height="58" rx="10"/><text class="txt" x="432" y="365">do 3 off로 다시 해제</text>
</svg>
