<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 220" role="img" aria-labelledby="title desc">
  <title id="title">시뮬레이션 상태 조회 흐름</title>
  <desc id="desc">status 명령이 SeerClient와 상태 서비스를 거쳐 로컬 시뮬레이터에서 상태를 받아 화면에 출력되는 흐름</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.box{fill:#eaf2ff;stroke:#2563eb;stroke-width:2}.sim{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.line{stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}.txt{font:500 15px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033;text-anchor:middle;dominant-baseline:middle}@media(prefers-color-scheme:dark){.box{fill:#172554;stroke:#60a5fa}.sim{fill:#052e16;stroke:#4ade80}.txt{fill:#f8fafc}.line{stroke:#94a3b8}}</style></defs>
  <rect class="box" x="15" y="75" width="150" height="62" rx="10"/><text class="txt" x="90" y="106">status</text>
  <line class="line" x1="165" y1="106" x2="200" y2="106"/>
  <rect class="box" x="205" y="75" width="180" height="62" rx="10"/><text class="txt" x="295" y="106">manual_test.py</text>
  <line class="line" x1="385" y1="106" x2="420" y2="106"/>
  <rect class="box" x="425" y="75" width="160" height="62" rx="10"/><text class="txt" x="505" y="106">SeerClient</text>
  <line class="line" x1="585" y1="106" x2="620" y2="106"/>
  <rect class="box" x="625" y="75" width="160" height="62" rx="10"/><text class="txt" x="705" y="106">status.py</text>
  <line class="line" x1="785" y1="106" x2="820" y2="106"/>
  <rect class="box" x="825" y="75" width="170" height="62" rx="10"/><text class="txt" x="910" y="98"><tspan x="910">STATE</tspan><tspan x="910" dy="20">TCP 포트</tspan></text>
  <line class="line" x1="995" y1="106" x2="1030" y2="106"/>
  <rect class="sim" x="1035" y="75" width="190" height="62" rx="10"/><text class="txt" x="1130" y="98"><tspan x="1130">로컬</tspan><tspan x="1130" dy="20">시뮬레이터</tspan></text>
